services:
  backend_cr:
    image: crypto-crush:latest
    secrets:
      - contract_address
      - contract_owner_private_key
      - jwt_token_secret
      - postgres_connection_string
      - rpc_url
      - network_id
    environment:
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - crypto_crush_db
    ports:
      - "5000:8080"
      - "5001:8081"
    networks:
      - backend_net
      - proxy
        
  crypto_crush_db:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: crypto_crush
    volumes:
     - postgres18_data:/var/lib/postgresql
    secrets:
      - db_password
    networks:
      - backend_net
  
  frontend_cr:
    image: crypto_crush_front:latest
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    volumes:
      - frontend_static:/app/.next/static:ro
    networks:
      - backend_net
      - proxy

secrets:
  db_password:
    external: true
  postgres_connection_string:
    external: true
  contract_address:
    external: true
  contract_owner_private_key:
    external: true
  jwt_token_secret:
    external: true
  network_id:
    external: true
  rpc_url:
    external: true

volumes:
  postgres18_data:
  nextjs_cache:
  frontend_static:

networks:
  backend_net:
    driver: overlay
  proxy:
    external: true
